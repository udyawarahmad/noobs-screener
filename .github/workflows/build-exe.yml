name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload the .exe to (leave blank to only keep the Actions artifact)"
        required: false
        default: ""
  push:
    branches:
      - "arena/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Windows .exe
        shell: pwsh
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npm run dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noobs-Screener-win
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Upload .exe to Release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          files: |
            dist/*.exe
            dist/*.zip
          fail_on_unmatched_files: true
